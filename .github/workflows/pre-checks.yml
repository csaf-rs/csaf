name: pre-checks

on:
  push:
    branches:
      - main
    tags:
      - v*.**
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit message
        uses: csaf-rs/shared-workflows/.github/actions/commitlint@d2387a7a07dbcf6676cf15470a1ca263010c8039 # v1.5.0
