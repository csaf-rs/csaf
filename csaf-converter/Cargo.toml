[package]
name = "csaf-converter"
description = "A converter for the CSAF standard written in Rust (converts 2.0 to 2.1)"
license.workspace = true
repository.workspace = true
keywords = ["csaf", "converter"]
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name= "csaf_converter"
path= "src/lib.rs"

[[bin]]
name = "csaf_converter"
path= "src/main.rs"
required-features = ["cli"]

[features]
default=[]
cli= ["dep:clap"]

[dependencies]
csaf-rs = { path = "../csaf-rs", version = "0.6", features = ["converter"] }
anyhow = "1.0.93"
clap = { version = "4.5.23", features = ["derive"], optional=true }
serde_json = { version = "1.0.131", features = ["preserve_order"] }
