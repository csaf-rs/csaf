name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*.**
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency: # cancel in-progress runs of the same PR and superseded pushes to main; tags and merge-queue runs stay isolated
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      msrv-version: ${{ steps.build-context.outputs.msrv-version }}
      stable-version: ${{ steps.build-context.outputs.stable-version }}
      git-version: ${{ steps.build-context.outputs.git-version }}
      targets: ${{ steps.build-context.outputs.targets }}
      target-ref: ${{ steps.build-context.outputs.targetref }}
      go-targets: ${{ steps.get-go-targets.outputs.go-targets }}
      ref-name: ${{ steps.build-context.outputs.ref-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"
          fetch-depth: 0
          fetch-tags: true
      - name: Check assets are up-to-date
        run: |
          ./scripts/update/update_assets.sh
          CHANGES=$(git status --porcelain)
          if [ -n "$CHANGES" ]; then
            echo "::error::Assets are out of date. Please run ./scripts/update/update_assets.sh locally and commit the changes."
            echo "$CHANGES"
            exit 1
          fi
      - name: Use cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: prepare
      - name: Check JSON syntax
        run: ./scripts/json/check_json_syntax.sh --quiet
      - name: Check JSON formatting
        run: ./scripts/json/check_json_formatting.sh --quiet
      - name: Check JSON sorting
        run: ./scripts/json/check_json_sorting.sh --quiet
      - name: Check supplementary test tracking IDs
        run: ./scripts/json/check_supplementary_test_tracking_id.sh
      - name: Check supplementary test publishers
        run: ./scripts/json/check_supplementary_test_publisher.sh
      - name: Update rustup
        run: rustup update stable --no-self-update
      - name: Run shared format and doc checks
        uses: csaf-rs/shared-workflows/.github/actions/rust-checks@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0
        with:
          run-clippy: "false"
      - name: Run type-generator
        run: cargo run --locked -p type-generator
      - name: Check for uncommitted changes in generated files
        run: |
          CHANGES=$(git status --porcelain -- csaf-rs/src/ csaf-rs/assets/)
          if [ -n "$CHANGES" ]; then
            echo ""
            echo "$CHANGES"
            echo ""
            echo "::error::Generated files are out of date or untracked!"
            echo "The files in csaf-rs/src/ or csaf-rs/assets/ do not match the output of the type-generator."
            echo "Please run 'cargo run --locked -p type-generator' and commit the updated files."
            exit 1
          fi
      - name: Compute Rust build context
        id: build-context
        uses: csaf-rs/shared-workflows/.github/actions/rust-build-context@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0
      - name: Compute Go build targets
        id: get-go-targets
        run: |
          FULL_GO_TARGETS=$(jq -cn '[
            {"target-arch": "x86_64-unknown-linux-gnu",  "runs-on": "ubuntu-latest",    "lib-ext": ".so", "go-arch": "amd64"},
            {"target-arch": "aarch64-unknown-linux-gnu", "runs-on": "ubuntu-24.04-arm", "lib-ext": ".so", "go-arch": "arm64"},
            {"target-arch": "aarch64-apple-darwin",      "runs-on": "macos-latest",     "lib-ext": ".dylib", "go-arch": "arm64"},
            {"target-arch": "x86_64-apple-darwin",       "runs-on": "macos-latest",     "lib-ext": ".dylib", "go-arch": "amd64"}
          ]')
          PR_GO_TARGETS=$(jq -cn '[
            {"target-arch": "x86_64-unknown-linux-gnu",  "runs-on": "ubuntu-latest",    "lib-ext": ".so", "go-arch": "amd64"}
          ]')
          if [[ ${{ github.event_name }} == "pull_request" ]]; then
            echo "go-targets=$PR_GO_TARGETS" >> $GITHUB_OUTPUT
          else
            echo "go-targets=$FULL_GO_TARGETS" >> $GITHUB_OUTPUT
          fi
      - name: Publish dry-run
        if: github.ref_type != 'tag'
        uses: csaf-rs/shared-workflows/.github/actions/cargo-publish-dry-run@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0

  build-matrix:
    needs: prepare
    permissions:
      contents: read
    strategy:
      matrix:
        version:
          - ${{ needs.prepare.outputs.msrv-version }}
          - ${{ needs.prepare.outputs.stable-version }}
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    runs-on: ${{ matrix.target.runs-on }}
    env:
      # csaf-ffi (uniffi) is only built/tested/linted on the stable toolchain row
      exclude-ffi-args: ${{ matrix.version != needs.prepare.outputs.stable-version && '--exclude csaf-ffi' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"
      - name: Use cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-${{ matrix.version }}-${{ matrix.target.arch }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.version }} --profile minimal
          rustup default ${{ matrix.version }}
          rustup target add ${{ matrix.target.arch }}
      - name: Install cargo-auditable
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-auditable
      - name: Run shared clippy check
        if: matrix.version == needs.prepare.outputs.stable-version || contains(matrix.target.arch, 'linux')
        uses: csaf-rs/shared-workflows/.github/actions/rust-checks@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0
        with:
          run-format: "false"
          run-doc: "false"
          clippy-extra-args: "--target=${{ matrix.target.arch }} ${{ env.exclude-ffi-args }}"
      - name: Build
        run: cargo auditable build --locked --target=${{ matrix.target.arch }} --release --verbose --features="cli" --workspace ${{ env.exclude-ffi-args }}
      - name: Run tests
        run: cargo test --locked --target=${{ matrix.target.arch }} --release --verbose --workspace ${{ env.exclude-ffi-args }}
        if: ${{ matrix.version == needs.prepare.outputs.stable-version && matrix.target.skip-test != true }}
      - name: Smoke test csaf-validator
        if: matrix.version == needs.prepare.outputs.stable-version && matrix.target.skip-test != true
        shell: bash
        run: ./scripts/smoke-tests/smoke-test-csaf-validator.sh target/${{ matrix.target.arch }}/release/csaf${{ matrix.target.ext }}
      - name: Build with --no-default-features
        run: cargo build --locked --target=${{ matrix.target.arch }} --no-default-features --verbose --workspace ${{ env.exclude-ffi-args }}
        if: ${{ matrix.target.skip-test != true }}
      - name: Archive csaf (${{ matrix.target.arch }})
        if: matrix.version == needs.prepare.outputs.stable-version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # family prefix must stay csaf-cli-*: the create-release download
          # patterns select by csaf-<family>* and csaf- would collide
          name: csaf-cli-${{ matrix.target.arch }}-${{ needs.prepare.outputs.git-version }}
          path: target/${{ matrix.target.arch }}/release/csaf${{ matrix.target.ext }}
      - name: Archive libcsaf_ffi (${{ matrix.target.arch }})
        if: matrix.version == needs.prepare.outputs.stable-version && matrix.target.skip-test != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libcsaf_ffi-${{ matrix.target.arch }}-${{ needs.prepare.outputs.git-version }}
          path: |
            target/${{ matrix.target.arch }}/release/libcsaf_ffi.a
            target/${{ matrix.target.arch }}/release/libcsaf_ffi.so
            target/${{ matrix.target.arch }}/release/libcsaf_ffi.dylib
            target/${{ matrix.target.arch }}/release/csaf_ffi.dll
          if-no-files-found: ignore
      - name: Generate CycloneDX and SPDX SBOMs
        if: matrix.version == needs.prepare.outputs.stable-version
        uses: csaf-rs/shared-workflows/.github/actions/sbom-generation@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0
        with:
          # csaf embeds both validator and converter; its SBOM is the superset
          file-to-scan: ./target/${{ matrix.target.arch }}/release/csaf${{ matrix.target.ext }}
          artifact-name-prefix: csaf_${{ matrix.target.arch }}

  build-platforms:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        if: needs.build-matrix.result != 'success'
        run: exit 1

  coverage:
    needs:
      - prepare
    uses: csaf-rs/shared-workflows/.github/workflows/rust-coverage.yml@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0

  wasm-bindings:
    needs:
      - prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"
      - name: Use cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm-bindings
          # we use specific version pinned caching of the binaries further down
          cache-bin: "false"
      - name: Update rustup
        run: rustup update stable --no-self-update
      - name: Prepare target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache uniffi-bindgen-js
        id: uniffi-js-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-js
          key: uniffi-bindgen-js-0.2.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install uniffi-bindgen-js
        if: steps.uniffi-js-cache.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-js --version 0.2.1 --locked
      - name: Build UniFFI WASM bindings
        run: bash scripts/publish/generate_wasm_bindings.sh
      - name: Run WASM regression tests
        working-directory: ./wasm
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: NPM pack dry-run
        working-directory: ./wasm
        run: npm pack --dry-run
      - name: Remove node_modules before archiving
        run: rm -rf wasm/node_modules
      - name: Archive UniFFI WASM bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csaf-ffi-wasm-${{ needs.prepare.outputs.git-version }}
          path: wasm/
      - name: Generate CycloneDX and SPDX SBOMs
        uses: csaf-rs/shared-workflows/.github/actions/sbom-generation@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 #v1.12.0
        with:
          file-to-scan: ./target/wasm32-unknown-unknown/release/csaf_ffi.wasm
          artifact-name-prefix: csaf-ffi-wasm_wasm32

  go-bindings:
    needs:
      - prepare
      - build-platforms
    strategy:
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.go-targets) }}
    runs-on: ${{ matrix.target.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - name: Cache uniffi-bindgen-go
        id: uniffi-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-go
          key: uniffi-bindgen-go-v0.7.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install uniffi-bindgen-go
        if: steps.uniffi-cache.outputs.cache-hit != 'true'
        run: |
          cargo install uniffi-bindgen-go \
            --git https://github.com/NordSecurity/uniffi-bindgen-go \
            --tag v0.7.0+v0.31.0 --locked
      - name: Download libcsaf_ffi
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libcsaf_ffi-${{ matrix.target.target-arch }}-${{ needs.prepare.outputs.git-version }}
          path: target/${{ matrix.target.target-arch }}/release/
      - name: Generate Go bindings
        run: |
          uniffi-bindgen-go \
            --library target/${{ matrix.target.target-arch }}/release/libcsaf_ffi${{ matrix.target.lib-ext }} \
            --out-dir go/
      - name: Copy static library for CGo
        run: |
          GOOS=$(go env GOOS)
          GOARCH=${{ matrix.target.go-arch }}
          LIB_DIR="go/csaf_ffi/lib/${GOOS}_${GOARCH}"
          mkdir -p "$LIB_DIR"
          # rustc archives LLVM metadata sections (.llvmbc bitcode, .llvmcmd, ...)
          # into the staticlib, also for objects of the precompiled std rlibs that
          # RUSTFLAGS cannot affect. go's cgo refuses to link archives
          # containing them since go1.27.4 ("disallowed LTO section"), so strip
          # them from the copy handed to CGo. Nothing consumes cross-language
          # LTO. ELF calls them .llvm*, Mach-O __LLVM,*. macOS runners ship no
          # objcopy, so use llvm-objcopy from the rust toolchain there.
          case "${{ matrix.target.target-arch }}" in
            *linux*)
              objcopy --remove-section='.llvm*' \
                "target/${{ matrix.target.target-arch }}/release/libcsaf_ffi.a" \
                "$LIB_DIR/libcsaf_ffi.a"
              ;;
            *apple-darwin*)
              rustup component add llvm-tools
              LLVM_OBJCOPY="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-objcopy"
              "$LLVM_OBJCOPY" --wildcard --remove-section='__LLVM,*' \
                "target/${{ matrix.target.target-arch }}/release/libcsaf_ffi.a" \
                "$LIB_DIR/libcsaf_ffi.a"
              ;;
            *)
              cp "target/${{ matrix.target.target-arch }}/release/libcsaf_ffi.a" "$LIB_DIR/"
              ;;
          esac
      - name: Run Go tests
        working-directory: go
        run: |
          GOOS=$(go env GOOS) GOARCH=${{ matrix.target.go-arch }} CGO_ENABLED=1 go test -v ./csaf_ffi/
      - name: Archive Go static library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-csaf-ffi-lib-${{ runner.os }}-${{ matrix.target.go-arch }}-${{ needs.prepare.outputs.git-version }}
          path: go/csaf_ffi/lib/

  devguard-secret-scanning: # uses gitleaks
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    needs:
      - prepare
      - build-platforms
    runs-on: ubuntu-latest
    steps:
      - name: Run devguard-scanner secret-scanning
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:v1.17.2
        with:
          args: devguard-scanner secret-scanning --assetName=${{ vars.DEVGUARD_ASSET }} --token="${{ secrets.DEVGUARD_TOKEN }}"  ${{ needs.prepare.outputs.target-ref }}  --isTag=${{ github.ref_type == 'tag' }}
  devguard-sast: #uses semgrep
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    needs:
      - prepare
      - build-platforms
    runs-on: ubuntu-latest
    steps:
      - name: Run devguard-scanner sast
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:v1.17.2
        with:
          args: devguard-scanner sast --assetName=${{ vars.DEVGUARD_ASSET }} --token="${{ secrets.DEVGUARD_TOKEN }}" ${{ needs.prepare.outputs.target-ref }}  --isTag=${{ github.ref_type == 'tag' }}
  devguard-iac: # uses checkov
    needs:
      - prepare
      - build-platforms
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    steps:
      - name: Run devguard-scanner iac
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:v1.17.2
        with:
          args: devguard-scanner iac --assetName=${{ vars.DEVGUARD_ASSET }} --token="${{ secrets.DEVGUARD_TOKEN }}" ${{ needs.prepare.outputs.target-ref }} --isTag=${{ github.ref_type == 'tag' }}
  process-sboms:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    needs:
      - prepare
      - build-platforms
      - wasm-bindings
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Cache devguard-scanner
        id: cache-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/devguard-scanner
          key: devguard-scanner-${{ runner.os }}-v1.17.2
      - name: Install devguard-scanner
        if: steps.cache-scanner.outputs.cache-hit != 'true'
        run: |
          go install github.com/l3montree-dev/devguard/cmd/devguard-scanner@3eb53ee70d22ce2a4280a3336ad9b904842baded # v1.17.2

      - name: Download all CDX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*_sbom.cdx.json"
          path: sboms/

      - name: Process CDX files
        # Prevent direct interpolation of potentially untrusted Git ref values into the shell script:
        # https://docs.github.com/en/actions/reference/security/secure-use#good-practices-for-mitigating-script-injection-attacks
        continue-on-error: true
        env:
          REF_NAME: ${{ needs.prepare.outputs.ref-name }}
          TARGET_REF: ${{ needs.prepare.outputs.target-ref }}
        run: |
          # Determine version segment for PURL
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PURL_VERSION="$REF_NAME"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PURL_VERSION="pr-${{ github.event.pull_request.number }}"
          else
            PURL_VERSION="latest"
          fi

          for cdx_file in $(find sboms -type f -name "*.cdx.json"); do
            echo "Processing: $cdx_file"

            filename=$(basename "$cdx_file")
            # Strip _sbom.cdx.json suffix to get "<name>_<arch>"
            raw=${filename%_sbom.cdx.json}

            # Split name and arch: name uses hyphens, arch starts after first underscore
            name=${raw%%_*}
            arch=${raw#*_}

            artifactName="pkg:generic/${name}@${PURL_VERSION}?arch=${arch}"

            echo "Artifact: $artifactName"

            tagOpt=""
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              tagOpt="--isTag=true"
            fi

            devguard-scanner sbom "$cdx_file" --assetName="${{ vars.DEVGUARD_ASSET }}" --token="${{ secrets.DEVGUARD_TOKEN }}" --artifactName="$artifactName" "$TARGET_REF" $tagOpt 2>&1
          done

  publish-crates:
    permissions:
      contents: read
      id-token: write
    needs:
      - build-platforms
    uses: csaf-rs/shared-workflows/.github/workflows/cargo-publish.yml@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - prepare
      - wasm-bindings
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha')
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Download WASM bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csaf-ffi-wasm-${{ needs.prepare.outputs.git-version }}
          path: wasm/
      - name: Publish to NPM
        working-directory: ./wasm
        run: |
          npm publish --provenance

  publish-go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prepare
      - go-bindings
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - name: Download Go library for verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-csaf-ffi-lib-Linux-amd64-${{ needs.prepare.outputs.git-version }}
          path: go/csaf_ffi/lib/
      - name: Verify Go module builds
        working-directory: ./go
        run: |
          CGO_LDFLAGS="-L$(pwd)/csaf_ffi/lib/linux_amd64" go build ./...
      - name: Push Go module tag
        run: |
          GO_TAG="go/${{ github.ref_name }}"
          if ! git rev-parse -q --verify "refs/tags/$GO_TAG" >/dev/null 2>&1; then
            git tag "$GO_TAG"
            git push origin "$GO_TAG"
          else
            echo "Tag $GO_TAG already exists, skipping."
          fi
      - name: Publish to Go module proxy
        run: GOPROXY=proxy.golang.org go list -m "github.com/csaf-rs/csaf/go@${{ github.ref_name }}"

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prepare
      - publish-crates
      - publish-npm
      - publish-go
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: csaf-cli
          pattern: csaf-cli-*-${{ needs.prepare.outputs.git-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csaf-ffi-wasm-${{ needs.prepare.outputs.git-version }}
          path: csaf-ffi-wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: go-csaf-ffi-lib
          pattern: go-csaf-ffi-lib-*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sboms
          pattern: "*_sbom.*"
      - name: Zip Artifacts
        run: |
          # release assets named after cargo-binstall's default filename
          # template ({name}-{target}-v{version}.zip) so `cargo binstall csaf`
          # finds them without [package.metadata.binstall]
          for dir in csaf-cli/*/; do
            name=$(basename "$dir")
            [ -d "$dir" ] || continue
            zip "csaf-${name#csaf-cli-}.zip" -rj "$dir"
          done
          ls csaf-x86_64-*.zip csaf-aarch64-*.zip
          zip "csaf-ffi-wasm-${{ needs.prepare.outputs.git-version }}.zip" -rj csaf-ffi-wasm/
          for dir in go-csaf-ffi-lib/*/; do
            name=$(basename "$dir")
            zip "${name}.zip" -rj "$dir"
          done
          ls go-csaf-ffi-lib-*.zip
      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          # csaf binary zips use cargo-binstall's default asset naming; the
          # arch stems keep the globs disjoint from the csaf-ffi-wasm zips
          files: |
            csaf-x86_64-*.zip
            csaf-aarch64-*.zip
            csaf-ffi-wasm-*.zip
            go-csaf-ffi-lib-*.zip
            sboms/**/*.json
