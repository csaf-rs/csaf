# Default configuration for csaf-service.
#
# Do not edit this file for local overrides — copy `config/local.example.toml`
# to `config/local.toml` instead (it is gitignored and takes precedence over
# these defaults). Any setting can also be overridden via environment
# variables prefixed with `CSAF_SERVICE__` (double underscore, also used as
# the nesting separator), e.g. `CSAF_SERVICE__SERVER__PORT=9000` or
# `CSAF_SERVICE__CORS__PERMISSIVE=true`. Environment variables take
# precedence over both this file and `config/local.toml`.

[server]
# Host the service listens on. Use "0.0.0.0" to listen on all interfaces.
host = "localhost"
port = 8082
# Maximum accepted request body size, in MB. Hard-capped at 150 MB as
# required by the CSAF standard, regardless of this setting.
body_limit_mb = 150

[cors]
# When true, allows all origins/methods/headers. Do not use in production.
permissive = false
# Explicit allow-list used when `permissive` is false. Empty means no
# cross-origin requests are allowed.
allowed_origins = []
allowed_methods = ["GET", "POST"]
