name: Make PR for external assets update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 6"

permissions:
  contents: write
  pull-requests: write

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: generate-token
        with:
          app-id: ${{ secrets.ASSET_UPDATER_APP_ID }}
          private-key: ${{ secrets.ASSET_UPDATER_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update external assets
        run: ./scripts/update/update_ext_assets.sh

      - name: Regenerate language tags from subtag registry
        working-directory: type-generator
        run: cargo run --locked -- --language-tags

      - name: Run cargo check (for .rs file re-generation)
        run: cargo check --locked

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: 'chore: update external assets'
          branch: 'update-external-assets'
          delete-branch: true
          title: 'chore: update external assets'
