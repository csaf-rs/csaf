name: Make PR for external assets update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 6"

permissions:
  contents: write
  pull-requests: write

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.ASSET_UPDATER_APP_ID }}
          private-key: ${{ secrets.ASSET_UPDATER_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update external assets
        run: ./scripts/update/update_ext_assets.sh

      - name: Regenerate language tags from subtag registry
        working-directory: type-generator
        run: cargo run --locked -- --language-tags

      - name: Run cargo check (for .rs file re-generation)
        run: cargo check --locked

      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: 'Update External Assets'
          branch: 'update-external-assets'
          delete-branch: true
          title: 'Update External Assets'