name: benchmark

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/build.yml'
      - 'scripts/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/build.yml'
      - 'scripts/**'

concurrency:
  group: benchmark-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Use cache
        uses: Swatinem/rust-cache@v2
        with:
          key: benchmark

      - name: Update rustup
        run: rustup update stable --no-self-update

      - name: Run benchmarks
        run: cargo bench --bench validation_benchmark -- --output-format bencher > output.txt

      - name: Remove criterion output from cache
        # target/criterion holds Criterion's own baseline comparison state, which is unused here
        # (benchmark-action tracks trends itself via gh-pages) and can become stale/inconsistent
        # across cached runs, breaking the bencher-format output. Exclude it from rust-cache by
        # deleting it before the cache is saved in the action's post step.
        if: always()
        run: rm -rf target/criterion

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: CSAF Validation Benchmark
          tool: "cargo"
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: "150%"
          comment-on-alert: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          summary-always: true
          comment-always: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
