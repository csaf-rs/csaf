[package]
name = "csaf-validator"
description = "A validator for the CSAF standard written in Rust"
license.workspace = true
repository.workspace = true
keywords.workspace = true
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "csaf_validator"
path = "src/lib.rs"

[[bin]]
name= "csaf-validator"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli=["dep:clap", "dep:anstyle", "dep:anstream"]

[dependencies]
anstream = {version="1.0.0", optional=true}
anstyle = {version="1.0.8", optional=true}
anyhow = "1.0.93"
clap = { version = "4.5.23", features = ["derive"], optional=true }
csaf-rs = { path = "../csaf-rs", version = "0.6" }
