[package]
name = "csaf-rs"
description = "A parser for the CSAF standard written in Rust"
license.workspace = true
repository.workspace = true
keywords.workspace = true
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build/main.rs"

[lints]
workspace = true

[lib]
name = "csaf"
crate-type = ["rlib"]

[features]
default = []
converter = []
utoipa = ["dep:utoipa"]

[dependencies]
cvss-rs = "0.5.0"
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.131", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
packageurl = "0.7"
semver = { version = "1" }
jsonschema = { version = "0.60.0", default-features = false, features = [
    "macros",
] }
spdx = "0.13.4"
oxilangtag = "0.1.5"
ssvc = "0.4.1"
strum = { version = "0.28", features = ["derive"] }
symspell = "0.5.2"
thiserror = { version = "2" }
utoipa = { version = "6", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
vers-like-specifier = "0.1"
vers-rs = "0.2"
# TODO: Replace with properly maintained cpe-rs crate #1158
cpe = { version = "0.2", package = "cpe-rs-fork" }
purl = "0.1.6"
itertools = "0.15.0"

[build-dependencies]
ssvc = "0.4.1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
rstest = "0.28.0"
criterion = { version = "0.8", features = ["html_reports"] }
jsonpath-rust = "1.0.11"
tempfile = "3"

[[bench]]
name = "validation_benchmark"
harness = false

[[test]]
name = "converter-conformance"
required-features = ["converter"]
