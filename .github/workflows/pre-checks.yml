name: pre-checks

on:
  push:
    branches:
      - main
    tags:
      - v*.**
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint commit message
        uses: csaf-rs/shared-workflows/.github/actions/commitlint@4828cd545465d4faade7eb410621ad7d8954f0dc # v1.9.0
